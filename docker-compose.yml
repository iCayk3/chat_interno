services:
  postgres:
    image: postgres:17-alpine
    container_name: solcrm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-solcrm}
    ports:
      - "5432:5432"
    volumes:
      - solcrm_postgres_data:/var/lib/postgresql/data

volumes:
  solcrm_postgres_data:
